name: 每日股票简报

# 交易日北京时间 18:20 自动运行（UTC 10:20），电脑关机也照常执行
on:
  schedule:
    - cron: '20 10 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: '强制运行（跳过交易日检查）'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: 随机延迟（错峰）
        run: sleep $((RANDOM % 120))

      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 生成简报并推送微信
        env:
          TZ: Asia/Shanghai
          PYTHONUTF8: '1'
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DSA_BRIEF_DESKTOP_DIR: ${{ runner.temp }}/brief
        run: python daily_brief.py --push

      - name: 归档报告到仓库（供本地开机自动同步）
        if: always()
        run: |
          git config user.name "stock-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f reports/report_*.md reports/brief_*.md reports/market_review_*.md 2>/dev/null || true
          # 仅保留最近 10 个交易日的全文报告，控制仓库体积
          ls -1t reports/report_*.md 2>/dev/null | tail -n +11 | while read -r f; do
            git rm --cached -q -f "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then
            echo "no report changes"
          else
            git commit -m "brief: $(TZ=Asia/Shanghai date +%F) [skip ci]"
            git push
          fi

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brief-${{ github.run_id }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
